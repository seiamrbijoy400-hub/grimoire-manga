name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: '9'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build web assets
        run: pnpm run build

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Sync Capacitor Android
        run: pnpm exec cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Rename Debug APK
        run: |
          mv android/app/build/outputs/apk/debug/app-debug.apk \
             kuroscroll-debug.apk

      - name: Get short SHA for release tag
        id: vars
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Delete existing release (if any)
        run: |
          gh release delete latest-build --yes || true
          git push --delete origin latest-build || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create public GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: "KUROSCROLL – Latest Build (${{ steps.vars.outputs.sha }})"
          body: |
            ## 📲 KUROSCROLL Android APK

            **Direct install:** download `kuroscroll-debug.apk` below, transfer it to your phone and install.

            > ⚠️ You may need to enable **Install from unknown sources** in your Android settings the first time.

            Built from commit `${{ steps.vars.outputs.sha }}` on `main`.
          files: kuroscroll-debug.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
