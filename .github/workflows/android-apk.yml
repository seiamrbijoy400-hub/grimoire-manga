name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install latest PNPM
        run: npm install -g pnpm@latest

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build web assets
        run: pnpm run build

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Sync Capacitor Android
        run: pnpm exec cap sync android

      - name: Build Android APKs with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease

      - name: Prepare APK outputs
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk KUROSCROLL-debug.apk
          cp android/app/build/outputs/apk/release/app-release.apk KUROSCROLL-release.apk
          ls -la KUROSCROLL-*.apk

      - name: Upload APKs as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KUROSCROLL-Android-APK
          path: |
            KUROSCROLL-debug.apk
            KUROSCROLL-release.apk
          retention-days: 14

      - name: Publish Public GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.0"
          gh release delete "$TAG" --yes || true
          git tag -d "$TAG" 2>/dev/null || true
          git push origin ":refs/tags/$TAG" 2>/dev/null || true

          gh release create "$TAG" \
            KUROSCROLL-release.apk \
            KUROSCROLL-debug.apk \
            --title "KUROSCROLL Android App (Latest)" \
            --notes "## 📲 KUROSCROLL Android App

Direct download links for Android installation:

- 📥 **[Download KUROSCROLL-release.apk](https://github.com/seiamrbijoy400-hub/grimoire-manga/releases/download/v1.0.0/KUROSCROLL-release.apk)**
- 📥 **[Download KUROSCROLL-debug.apk](https://github.com/seiamrbijoy400-hub/grimoire-manga/releases/download/v1.0.0/KUROSCROLL-debug.apk)**

### Installation Instructions:
1. Tap the download link above directly on your phone.
2. Open the downloaded \`.apk\` file to install.
3. If Android prompts *'Install unknown apps'*, allow your browser to install.
"
