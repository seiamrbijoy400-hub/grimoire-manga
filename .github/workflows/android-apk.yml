name: Build Android Draft Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write
  repository-projects: read
  statuses: write

jobs:
  build:
    name: Build Android Draft Release
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: ${{ github.run_number }}
      TAG_NAME: v${{ github.run_number }}-${{ github.run_attempt }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install PNPM
        run: npm install -g pnpm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web assets
        run: pnpm run build

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Sync Capacitor Android
        run: pnpm exec cap sync android

      - name: Set Android versionCode and versionName
        run: |
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV

      - name: Build Android APKs with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease -PVERSION_CODE=$VERSION_CODE -PVERSION_NAME=$VERSION_NAME

      - name: Prepare APK outputs
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk KUROSCROLL-debug.apk
          cp android/app/build/outputs/apk/release/app-release.apk KUROSCROLL-release.apk
          sha256sum KUROSCROLL-*.apk > SHA256SUMS.txt
          ls -la KUROSCROLL-*.apk SHA256SUMS.txt

      - name: Create draft tag if not exists
        id: tag_check
        run: |
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create tag
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          git tag $TAG_NAME $GITHUB_SHA
          git push origin $TAG_NAME

      - name: Create draft release
        if: steps.tag_check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat <<EOF > release_notes.md
## 📲 KUROSCROLL Android Draft Release

- Tag: $TAG_NAME
- Commit: ${{ github.sha }}
- Build number: ${{ github.run_number }}
- Attempt: ${{ github.run_attempt }}

EOF
          gh release create $TAG_NAME KUROSCROLL-release.apk KUROSCROLL-debug.apk SHA256SUMS.txt \
            --title "KUROSCROLL Draft $TAG_NAME" \
            --notes-file release_notes.md \
            --draft

      - name: Upload artifacts for debugging
        uses: actions/upload-artifact@v4
        with:
          name: KUROSCROLL-APKs
          path: |
            KUROSCROLL-debug.apk
            KUROSCROLL-release.apk
            SHA256SUMS.txt
