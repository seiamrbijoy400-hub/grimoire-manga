name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install PNPM
        run: npm install -g pnpm@latest

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build web assets
        run: pnpm run build

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Sync Capacitor Android
        run: pnpm exec cap sync android

      - name: Build Android APKs with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease

      - name: Prepare APK outputs
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk KUROSCROLL-debug.apk
          cp android/app/build/outputs/apk/release/app-release.apk KUROSCROLL-release.apk
          ls -la KUROSCROLL-*.apk

      - name: Upload APKs as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KUROSCROLL-APKs
          path: |
            KUROSCROLL-debug.apk
            KUROSCROLL-release.apk

      - name: Create Release Notes
        run: |
          echo "## 📲 KUROSCROLL Android App" > release_notes.md
          echo "" >> release_notes.md
          echo "Direct download links:" >> release_notes.md
          echo "- **KUROSCROLL-release.apk** (Recommended)" >> release_notes.md
          echo "- **KUROSCROLL-debug.apk**" >> release_notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.0"
          gh release delete "$TAG" --yes || true
          git tag -d "$TAG" 2>/dev/null || true
          git push origin ":refs/tags/$TAG" 2>/dev/null || true
          gh release create "$TAG" KUROSCROLL-release.apk KUROSCROLL-debug.apk --title "KUROSCROLL Android App" --notes-file release_notes.md
